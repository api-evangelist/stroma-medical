aid: stroma-medical
name: Stroma Medical
description: >-
  Strōma Medical Corporation is a clinical-stage medical device company headquartered in Irvine,
  California, developing the Strōma Laser System — a patented laser technology that permanently
  changes eye color by removing the thin layer of brown pigment on the anterior surface of the iris,
  revealing the underlying amber, hazel, grey, blue or green color beneath. The in-office procedure
  uses only topical anesthetic, takes under a minute per eye per treatment, and reveals its result
  over three to four weeks. Strōma licenses the system to refractive surgeons and LASIK-certified
  ophthalmologists rather than selling to consumers directly. The device is investigational and is
  not available for sale or use in the United States, and the company filed a voluntary Chapter 11,
  Subchapter V case in the U.S. Bankruptcy Court for the District of Delaware. Strōma publishes no
  developer program, no public API, no SDKs and no machine-readable API contract of any kind; its
  public web presence is a six-page WordPress marketing site.
