other_findings:
- surface: WordPress core REST API
  url: https://www.stromamedical.com/wp-json
  status: 200
  note: >-
    The marketing site runs WordPress and its core REST API root answers anonymously with 146 routes
    across the wp/v2, oembed/1.0, wp-super-cache/v1, wp-site-health/v1, wp-block-editor/v1,
    wp-abilities/v1 and frm-admin/v1 namespaces. This is the WordPress CMS default, not a product
    API Strōma Medical designed, documented, versioned or offers to anyone — there is no developer
    portal, reference, key issuance or support channel for it, and wp/v2/posts returns
    x-wp-total: 0. It is recorded here as an honest observation and deliberately NOT registered as
    an apis[] entry or wired to any contract pointer, because crediting the company with shipping an
    API it never shipped is the error this pipeline exists to avoid.
